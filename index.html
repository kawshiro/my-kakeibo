<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI家計簿入力 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.8; cursor: pointer; }

        /* 選択状態のデザイン */
        .category-radio:checked + div {
            background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8;
            box-shadow: inset 0 0 0 1px #3b82f6; font-weight: bold;
        }
        .payment-radio:checked + div {
            background-color: #f0fdf4; border-color: #22c55e; color: #15803d;
            box-shadow: inset 0 0 0 1px #22c55e; font-weight: bold;
        }

        /* アニメーション */
        @keyframes slide-in-out {
            0% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
            10% { opacity: 1; transform: translateY(0) translateX(-50%); }
            90% { opacity: 1; transform: translateY(0) translateX(-50%); }
            100% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
        }
        .saved-toast {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            animation: slide-in-out 3s ease-in-out forwards; z-index: 9999;
        }
        input:focus::placeholder { color: transparent; }
        
        /* グリッド */
        .compact-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.15rem;
        }
        .compact-item {
            padding: 0; height: 3.8rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 0.4rem; border-width: 1px; font-size: 0.75rem; line-height: 1.1;
            transition: all 0.1s;
        }
        .compact-item i { font-size: 1.3rem; margin-bottom: 0.15rem; }
        .compact-item span { transform: scale(1); }

        /* AIアニメーション */
        .ai-thinking {
            background: linear-gradient(270deg, #6366f1, #a855f7, #ec4899);
            background-size: 600% 600%;
            animation: ai-gradient 3s ease infinite;
        }
        @keyframes ai-gradient { 
            0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
        }
        .mic-listening {
            animation: pulse-red 1.5s infinite;
            background-color: #ef4444 !important; color: white !important; border-color: #ef4444 !important;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden text-gray-800 font-sans flex flex-col cursor-pointer">

    <!-- 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm cursor-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto ring-1 ring-gray-200">
            <div class="p-4 border-b sticky top-0 bg-white z-10 flex justify-between items-center">
                <div><h2 class="text-lg font-bold text-gray-800"><i class="fas fa-cog text-gray-400 mr-2"></i>設定</h2></div>
                <button id="close-settings" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 px-4 rounded-lg text-sm">閉じる</button>
            </div>
            <div class="p-5 space-y-4">
                <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                    <label class="block text-xs font-bold text-indigo-700 mb-1"><i class="fas fa-robot mr-1"></i>Gemini APIキー</label>
                    <input type="password" id="setting-api-key" placeholder="AIを使う場合はここに入力" class="w-full p-2 border rounded font-mono text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <p class="text-[10px] text-indigo-500 mt-1">※キーは端末内にのみ保存されます</p>
                </div>
                <div><label class="block text-xs text-gray-600 font-bold mb-1">フォームURL</label><input type="text" id="setting-base-url" class="w-full p-2 border rounded text-xs font-mono bg-gray-50 text-gray-500" readonly></div>
                <div class="space-y-3 pt-2 border-t">
                    <details>
                        <summary class="text-xs font-bold text-gray-500 cursor-pointer">詳細ID設定 (タップで展開)</summary>
                        <div class="space-y-3 mt-2 pl-2 border-l-2 border-gray-100">
                            <div><label class="block text-[10px] font-bold text-gray-400 mb-1">金額</label><input type="text" id="setting-entry-amount" class="w-full p-1 border rounded font-mono text-xs"></div>
                            <div><label class="block text-[10px] font-bold text-gray-400 mb-1">どんなもの</label><input type="text" id="setting-entry-category" class="w-full p-1 border rounded font-mono text-xs"></div>
                            <div><label class="block text-[10px] font-bold text-gray-400 mb-1">支払い方法</label><input type="text" id="setting-entry-payment" class="w-full p-1 border rounded font-mono text-xs"></div>
                            <div><label class="block text-[10px] font-bold text-gray-400 mb-1">日付</label><input type="text" id="setting-entry-date" class="w-full p-1 border rounded font-mono text-xs"></div>
                            <div><label class="block text-[10px] font-bold text-gray-400 mb-1">備考欄</label><input type="text" id="setting-entry-memo" class="w-full p-1 border rounded font-mono text-xs"></div>
                        </div>
                    </details>
                </div>
            </div>
        </div>
    </div>

    <!-- AI入力モーダル -->
    <div id="ai-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 bg-gradient-to-r from-indigo-600 to-purple-600 flex justify-between items-center text-white shrink-0">
                <h2 class="font-bold flex items-center gap-2"><i class="fas fa-sparkles text-yellow-300"></i> AI入力</h2>
                <button id="close-ai" class="text-white/80 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-4 flex-1 flex flex-col gap-3 overflow-y-auto">
                <p class="text-xs text-gray-500">レシート撮影、またはテキスト・音声で入力</p>
                <div class="relative shrink-0">
                    <textarea id="ai-input-text" class="w-full p-3 border-2 border-indigo-100 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none resize-none h-32 text-lg" placeholder="ここに入力..."></textarea>
                    
                    <div class="absolute bottom-3 right-3 flex gap-2">
                        <label for="album-input" class="w-10 h-10 bg-green-100 hover:bg-green-200 rounded-full flex items-center justify-center text-green-600 transition shadow-sm border border-green-200 cursor-pointer" title="アルバムから選択">
                            <i class="fas fa-image"></i>
                        </label>
                        <label for="camera-input" class="w-10 h-10 bg-indigo-100 hover:bg-indigo-200 rounded-full flex items-center justify-center text-indigo-600 transition shadow-sm border border-indigo-200 cursor-pointer" title="カメラ起動">
                            <i class="fas fa-camera"></i>
                        </label>
                        <button id="mic-btn" type="button" class="w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-600 transition shadow-sm border border-gray-200" title="音声入力">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
                    <input type="file" id="album-input" accept="image/*" class="hidden">
                </div>
                
                <div class="flex gap-2 pb-2 shrink-0">
                    <button id="ai-analyze-btn" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition flex items-center justify-center gap-2">
                        解析のみ <i class="fas fa-magic"></i>
                    </button>
                    <button id="ai-analyze-send-btn" class="flex-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-4 rounded-xl shadow-lg hover:from-pink-600 hover:to-rose-600 active:scale-95 transition flex items-center justify-center gap-2">
                        解析＆送信 <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- ヘッダー -->
    <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-2 pb-2 text-white shadow-md z-20 shrink-0 relative overflow-hidden">
        <div class="absolute top-0 right-0 p-2 opacity-10 pointer-events-none"><i class="fas fa-wallet text-6xl"></i></div>
        
        <div class="flex justify-between items-center mb-1 relative z-30">
            <div class="bg-white/20 rounded px-2 py-1 flex items-center cursor-pointer hover:bg-white/30 transition">
                <input type="date" id="input-date" class="bg-transparent text-white font-bold text-sm focus:outline-none cursor-pointer w-28 h-7">
            </div>
            <div class="flex gap-3 items-center">
                <!-- AIボタン: z-50で最前面に配置 -->
                <button id="open-ai" type="button" class="h-9 px-4 rounded-full bg-gradient-to-br from-fuchsia-500 to-violet-600 hover:from-fuchsia-400 hover:to-violet-500 flex items-center justify-center text-white transition-all shadow-[0_0_10px_rgba(192,38,211,0.5)] border border-white/30 active:scale-95 hover:scale-105 group gap-2 z-50 cursor-pointer">
                    <svg class="w-4 h-4 drop-shadow-sm group-hover:rotate-180 transition-transform duration-700 ease-in-out" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C12 7.52285 16.4772 12 22 12C16.4772 12 12 16.4772 12 22C12 16.4772 7.52285 12 2 12C7.52285 12 12 7.52285 12 2Z" />
                    </svg>
                    <span class="font-bold text-sm tracking-wide font-sans">AI</span>
                </button>
                <button id="open-settings" type="button" class="w-9 h-9 flex items-center justify-center opacity-70 hover:opacity-100 transition z-50 cursor-pointer"><i class="fas fa-cog text-xl"></i></button>
            </div>
        </div>
        
        <div class="relative text-center py-0 z-10">
            <span class="absolute left-1 top-1/2 transform -translate-y-1/2 text-indigo-200 text-3xl font-light pointer-events-none">¥</span>
            <input type="number" id="input-amount" inputmode="decimal" pattern="[0-9]*" autofocus
                class="w-full bg-white/10 border-b-2 border-indigo-200/50 text-white text-6xl font-bold text-right px-4 py-2 focus:outline-none focus:bg-white/20 focus:border-white placeholder-indigo-200/30 tracking-tighter rounded-lg transition-all h-20 shadow-inner" 
                placeholder="0">
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="flex-1 p-1 flex flex-col gap-1 overflow-hidden h-full">
        
        <!-- 1. 費目 -->
        <section class="shrink-0">
            <h3 class="text-[10px] font-bold text-gray-500 uppercase mb-0.5 ml-1"><i class="fas fa-tag mr-1"></i>どんなもの</h3>
            <div class="compact-grid">
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="食費" class="category-radio sr-only" checked><div class="compact-item bg-white border-gray-300"><i class="fas fa-utensils text-orange-400"></i><span>食費</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="日用品" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-shopping-basket text-green-400"></i><span>日用品</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="衣服・美容費" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-tshirt text-pink-400"></i><span>衣服美容</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="娯楽・交際費" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-glass-cheers text-purple-400"></i><span>娯楽交際</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="交通費" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-train text-blue-400"></i><span>交通費</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="通信費" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-wifi text-cyan-500"></i><span>通信費</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="医療費" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-clinic-medical text-red-400"></i><span>医療費</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="category" value="その他" class="category-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-ellipsis-h text-gray-400"></i><span>その他</span></div></label>
            </div>
        </section>

        <!-- 2. 支払い方法 -->
        <section class="shrink-0">
            <h3 class="text-[10px] font-bold text-gray-500 uppercase mb-0.5 mt-0.5 ml-1"><i class="fas fa-wallet mr-1"></i>支払い方法</h3>
            <div class="compact-grid">
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="現金" class="payment-radio sr-only" checked><div class="compact-item bg-white border-gray-300"><i class="fas fa-coins text-gray-500"></i><span>現金</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="paypay" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><span class="font-bold text-red-600 text-[10px] mb-0.5">P</span><span>PayPay</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="モバイルSuica" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-mobile-alt text-green-600"></i><span>Suica</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="olive" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-leaf text-lime-600"></i><span>olive</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="三井住友ゴールドカード" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-credit-card text-yellow-600"></i><span class="scale-90">住友Gold</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="楽天カード" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-credit-card text-pink-600"></i><span>楽天</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="viewカード" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-subway text-blue-600"></i><span>View</span></div></label>
                <label class="cursor-pointer relative group"><input type="radio" name="payment" value="その他" class="payment-radio sr-only"><div class="compact-item bg-white border-gray-300"><i class="fas fa-ellipsis-h text-gray-400"></i><span>他</span></div></label>
            </div>
        </section>

        <!-- 3. メモ & 送信 -->
        <section class="flex-1 flex flex-col justify-end gap-1.5 mt-0.5 pb-1">
            <div class="relative w-full">
                <i class="fas fa-pen absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl pointer-events-none"></i>
                <input type="text" id="input-memo" 
                    class="w-full rounded-xl border-2 border-gray-300 bg-white pl-12 pr-4 h-14 outline-none focus:ring-4 focus:ring-indigo-200 focus:border-indigo-600 transition text-xl font-bold text-gray-700 shadow-sm placeholder-gray-400" 
                    placeholder="備考を入力..." 
                    enterkeyhint="go">
            </div>
            
            <button id="send-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold h-16 rounded-xl shadow-lg transform active:scale-[0.98] transition flex items-center justify-center gap-3 text-2xl group relative overflow-hidden">
                <span class="relative z-10">送信する</span> <i class="fas fa-paper-plane group-hover:translate-x-1 transition-transform relative z-10"></i>
            </button>
            <div class="text-center h-0 opacity-0 overflow-hidden"><a id="fallback-link" href="#" target="_blank">.</a></div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. 関数定義 ---
            const DEFAULTS = {
                baseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSdyfO5WEIVhLXzE9o7R29heMt6w5Pvf-iEgfZFPztJChzzO_Q/viewform?usp=header', 
                amountId: 'entry.319120210', dateId: 'entry.217676147', categoryId: 'entry.1341647002', paymentId: 'entry.594957767', memoId: 'entry.1139655263'      
            };
            const PREFIX = 'budget_2026_';
            const KEYS = { base: PREFIX+'baseUrl', amount: PREFIX+'entryAmount', payment: PREFIX+'entryPayment', date: PREFIX+'entryDate', category: PREFIX+'entryCategory', memo: PREFIX+'entryMemo', apiKey: PREFIX+'apiKey' };

            const showToast = (msg, type='success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `saved-toast ${type==='success'?'bg-slate-800':'bg-red-600'} text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-2`;
                toast.innerHTML = `<i class="fas ${type==='success'?'fa-check':'fa-exclamation'}"></i> ${msg}`;
                container.appendChild(toast); 
                setTimeout(() => toast.remove(), 2000);
            };

            const autoSave = (key, value) => { localStorage.setItem(key, value.trim()); updateLink(); };

            // URL生成関数（前回漏れていた部分）
            const generateUrl = () => {
                const base = localStorage.getItem(KEYS.base)||DEFAULTS.baseUrl;
                const p = new URLSearchParams();
                const getVal = (k, def) => localStorage.getItem(KEYS[k])||def;
                
                const amt = els.amount.value;
