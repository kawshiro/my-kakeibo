<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI家計簿入力 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- エラー検出用スクリプト -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            // alert('エラーが発生しました:\n' + message); // 安定したらコメントアウトしてもOK
        };
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; touch-action: manipulation; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 選択状態のデザイン */
        .category-radio:checked + div {
            background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8;
            box-shadow: inset 0 0 0 2px #3b82f6; font-weight: bold;
        }
        .payment-radio:checked + div {
            background-color: #f0fdf4; border-color: #22c55e; color: #15803d;
            box-shadow: inset 0 0 0 2px #22c55e; font-weight: bold;
        }

        /* トースト通知 */
        .saved-toast {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            animation: fadeInOut 3s forwards; z-index: 9999;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }

        /* グリッドレイアウト */
        .compact-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
        }
        .compact-item {
            height: 60px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid #e5e7eb; 
            font-size: 11px; line-height: 1.2; background: white;
        }
        .compact-item i { font-size: 18px; margin-bottom: 2px; }

        /* AIボタンアニメーション */
        .ai-thinking {
            background: linear-gradient(270deg, #6366f1, #a855f7, #ec4899);
            background-size: 600% 600%; animation: ai-gradient 3s ease infinite;
        }
        @keyframes ai-gradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        
        .mic-listening {
            background-color: #ef4444 !important; color: white !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden text-gray-800 flex flex-col">

    <!-- 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="p-4 border-b flex justify-between items-center">
                <h2 class="font-bold text-gray-800"><i class="fas fa-cog"></i> 設定</h2>
                <button id="close-settings" class="bg-gray-200 px-4 py-2 rounded font-bold text-sm">閉じる</button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-indigo-700 mb-1">Gemini APIキー</label>
                    <input type="password" id="setting-api-key" placeholder="AIを使う場合はここに入力" class="w-full p-2 border rounded font-mono text-sm bg-indigo-50">
                </div>
                <div><label class="block text-xs font-bold mb-1">フォームURL</label><input type="text" id="setting-base-url" class="w-full p-2 border rounded text-xs" readonly></div>
                <div class="pt-2 border-t">
                    <p class="text-xs font-bold mb-2">GoogleフォームのエントリーID</p>
                    <div class="grid gap-2">
                        <input type="text" id="setting-entry-amount" class="w-full p-2 border rounded text-xs" placeholder="金額ID">
                        <input type="text" id="setting-entry-category" class="w-full p-2 border rounded text-xs" placeholder="費目ID">
                        <input type="text" id="setting-entry-payment" class="w-full p-2 border rounded text-xs" placeholder="支払方法ID">
                        <input type="text" id="setting-entry-date" class="w-full p-2 border rounded text-xs" placeholder="日付ID">
                        <input type="text" id="setting-entry-memo" class="w-full p-2 border rounded text-xs" placeholder="備考ID">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AIモーダル -->
    <div id="ai-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col max-h-[85vh]">
            <div class="p-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white flex justify-between items-center shrink-0 rounded-t-2xl">
                <h2 class="font-bold text-lg"><i class="fas fa-sparkles text-yellow-300"></i> AI入力</h2>
                <button id="close-ai" class="text-white hover:bg-white/20 rounded-full w-8 h-8"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 flex-1 flex flex-col gap-3 overflow-y-auto">
                <p class="text-xs text-gray-500">テキスト入力、音声、または画像で自動入力します</p>
                <div class="relative">
                    <textarea id="ai-input-text" class="w-full p-3 border-2 border-indigo-100 rounded-xl h-32 text-lg focus:border-indigo-500 outline-none" placeholder="例：昨日コンビニで1200円"></textarea>
                    
                    <div class="absolute bottom-2 right-2 flex gap-2">
                        <label class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600 cursor-pointer border border-green-200">
                            <i class="fas fa-image"></i>
                            <input type="file" id="album-input" accept="image/*" class="hidden">
                        </label>
                        <label class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 cursor-pointer border border-blue-200">
                            <i class="fas fa-camera"></i>
                            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
                        </label>
                        <button id="mic-btn" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 border border-gray-200">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-2 shrink-0">
                    <button id="ai-analyze-btn" class="bg-indigo-600 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition">解析のみ</button>
                    <button id="ai-analyze-send-btn" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition">解析＆送信</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知エリア -->
    <div id="toast-container"></div>

    <!-- ヘッダー -->
    <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-2 text-white shadow-md z-30 shrink-0">
        <div class="flex justify-between items-center mb-1 gap-2">
            <input type="date" id="input-date" class="bg-white/20 text-white font-bold text-sm rounded px-2 py-1 border-none outline-none w-32 h-10">
            
            <div class="flex gap-2 items-center flex-1 justify-end">
                <!-- AIボタン: 大型化＆強調 -->
                <button id="open-ai" class="bg-gradient-to-br from-fuchsia-500 to-violet-600 text-white h-10 px-5 rounded-full shadow-lg border border-white/30 flex items-center gap-2 active:scale-95 transition transform hover:scale-105">
                    <i class="fas fa-sparkles text-lg animate-pulse text-yellow-300"></i> <span class="font-bold text-base tracking-wide">AI入力</span>
                </button>
                
                <!-- 設定ボタン -->
                <button id="open-settings" class="w-10 h-10 flex items-center justify-center opacity-80 hover:opacity-100">
                    <i class="fas fa-cog text-xl"></i>
                </button>
            </div>
        </div>
        
        <div class="relative h-16">
            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-2xl text-indigo-200">¥</span>
            <input type="number" id="input-amount" class="w-full h-full bg-transparent text-right text-5xl font-bold text-white border-b-2 border-indigo-300/50 focus:border-white outline-none px-2 placeholder-indigo-300/30" placeholder="0">
        </div>
    </div>

    <!-- メインエリア -->
    <div class="flex-1 p-2 flex flex-col gap-2 overflow-y-auto">
        <!-- 費目 -->
        <div>
            <div class="text-[10px] font-bold text-gray-500 mb-1 ml-1">カテゴリー</div>
            <div class="compact-grid" id="category-container">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- 支払 -->
        <div>
            <div class="text-[10px] font-bold text-gray-500 mb-1 ml-1">支払い方法</div>
            <div class="compact-grid" id="payment-container">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- メモ・送信 -->
        <div class="mt-auto pt-2 flex flex-col gap-2">
            <div class="relative">
                <i class="fas fa-pen absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="input-memo" class="w-full h-12 pl-10 pr-4 rounded-xl border border-gray-300 font-bold text-gray-700 outline-none focus:border-indigo-500" placeholder="備考">
            </div>
            
            <a id="hidden-link" href="#" target="_blank" style="display:none;"></a>
            <button id="send-btn" class="w-full h-14 bg-slate-800 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 text-xl active:scale-95 transition">
                送信する <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // 設定データ
        const CONFIG = {
            baseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSdyfO5WEIVhLXzE9o7R29heMt6w5Pvf-iEgfZFPztJChzzO_Q/viewform?usp=header', 
            ids: {
                amount: 'entry.319120210',
                date: 'entry.217676147',
                category: 'entry.1341647002',
                payment: 'entry.594957767',
                memo: 'entry.1139655263'
            },
            storageKey: 'budget_2026_data'
        };

        const CATEGORIES = [
            {val:'食費', icon:'fa-utensils', color:'text-orange-500'},
            {val:'日用品', icon:'fa-shopping-basket', color:'text-green-500'},
            {val:'衣服・美容費', icon:'fa-tshirt', color:'text-pink-500'},
            {val:'娯楽・交際費', icon:'fa-glass-cheers', color:'text-purple-500'},
            {val:'交通費', icon:'fa-train', color:'text-blue-500'},
            {val:'通信費', icon:'fa-wifi', color:'text-cyan-500'},
            {val:'医療費', icon:'fa-clinic-medical', color:'text-red-500'},
            {val:'その他', icon:'fa-ellipsis-h', color:'text-gray-500'}
        ];

        const PAYMENTS = [
            {val:'現金', icon:'fa-coins', color:'text-gray-600'},
            {val:'paypay', label:'P', color:'text-red-600', isText:true},
            {val:'モバイルSuica', icon:'fa-mobile-alt', color:'text-green-600'},
            {val:'olive', icon:'fa-leaf', color:'text-lime-600'},
            {val:'三井住友ゴールドカード', icon:'fa-credit-card', color:'text-yellow-600', label:'住友Gold'},
            {val:'楽天カード', icon:'fa-credit-card', color:'text-pink-600', label:'楽天'},
            {val:'viewカード', icon:'fa-subway', color:'text-blue-600', label:'View'},
            {val:'その他', icon:'fa-ellipsis-h', color:'text-gray-400'}
        ];

        // UI構築関数
        function renderRadios() {
            const catContainer = document.getElementById('category-container');
            const payContainer = document.getElementById('payment-container');

            // カテゴリ生成
            catContainer.innerHTML = CATEGORIES.map((c, i) => `
                <label class="cursor-pointer relative group">
                    <input type="radio" name="category" value="${c.val}" class="category-radio sr-only" ${i===0?'checked':''}>
                    <div class="compact-item">
                        <i class="fas ${c.icon} ${c.color}"></i>
                        <span>${c.val.replace('・','<br>').substring(0,4)}</span>
                    </div>
                </label>
            `).join('');

            // 支払い生成
            payContainer.innerHTML = PAYMENTS.map((p, i) => `
                <label class="cursor-pointer relative group">
                    <input type="radio" name="payment" value="${p.val}" class="payment-radio sr-only" ${i===0?'checked':''}>
                    <div class="compact-item">
                        ${p.isText ? `<span class="text-lg font-bold ${p.color}">${p.label}</span>` : `<i class="fas ${p.icon} ${p.color}"></i>`}
                        <span>${p.label || p.val}</span>
                    </div>
                </label>
            `).join('');
        }

        // DOM読み込み完了時の処理
        document.addEventListener('DOMContentLoaded', function() {
            renderRadios(); // ボタン生成

            // 要素取得
            const els = {
                modal: document.getElementById('settings-modal'),
                aiModal: document.getElementById('ai-modal'),
                openBtn: document.getElementById('open-settings'),
                closeBtn: document.getElementById('close-settings'),
                openAiBtn: document.getElementById('open-ai'),
                closeAiBtn: document.getElementById('close-ai'),
                analyzeBtn: document.getElementById('ai-analyze-btn'),
                analyzeSendBtn: document.getElementById('ai-analyze-send-btn'),
                sendBtn: document.getElementById('send-btn'),
                amount: document.getElementById('input-amount'),
                date: document.getElementById('input-date'),
                memo: document.getElementById('input-memo'),
                aiInput: document.getElementById('ai-input-text'),
                micBtn: document.getElementById('mic-btn'),
                cameraInput: document.getElementById('camera-input'),
                albumInput: document.getElementById('album-input'),
                hiddenLink: document.getElementById('hidden-link'),
                
                // 設定Inputs
                sApiKey: document.getElementById('setting-api-key'),
                sBaseUrl: document.getElementById('setting-base-url'),
                sAmt: document.getElementById('setting-entry-amount'),
                sCat: document.getElementById('setting-entry-category'),
                sPay: document.getElementById('setting-entry-payment'),
                sDate: document.getElementById('setting-entry-date'),
                sMemo: document.getElementById('setting-entry-memo')
            };

            // 初期化
            const today = new Date().toISOString().split('T')[0];
            els.date.value = today;
            
            // 設定読み込み
            const savedConfig = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '{}');
            els.sBaseUrl.value = savedConfig.baseUrl || CONFIG.baseUrl;
            els.sApiKey.value = savedConfig.apiKey || '';
            els.sAmt.value = savedConfig.amount || CONFIG.ids.amount;
            els.sCat.value = savedConfig.category || CONFIG.ids.category;
            els.sPay.value = savedConfig.payment || CONFIG.ids.payment;
            els.sDate.value = savedConfig.date || CONFIG.ids.date;
            els.sMemo.value = savedConfig.memo || CONFIG.ids.memo;

            // 設定保存関数
            const saveSettings = () => {
                const data = {
                    baseUrl: els.sBaseUrl.value,
                    apiKey: els.sApiKey.value,
                    amount: els.sAmt.value,
                    category: els.sCat.value,
                    payment: els.sPay.value,
                    date: els.sDate.value,
                    memo: els.sMemo.value
                };
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
            };

            // イベントリスナー設定 (設定画面)
            [els.sApiKey, els.sAmt, els.sCat, els.sPay, els.sDate, els.sMemo].forEach(el => {
                el.addEventListener('input', saveSettings);
            });

            // モーダル開閉
            els.openBtn.onclick = () => els.modal.classList.remove('hidden');
            els.closeBtn.onclick = () => els.modal.classList.add('hidden');
            els.openAiBtn.onclick = () => els.aiModal.classList.remove('hidden');
            els.closeAiBtn.onclick = () => els.aiModal.classList.add('hidden');

            // 送信処理 (最重要)
            els.sendBtn.onclick = function() {
                if(!els.amount.value) {
                    alert('金額を入力してください');
                    els.amount.focus();
                    return;
                }

                // 現在の設定値を取得
                const cfg = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '{}');
                const baseUrl = cfg.baseUrl || CONFIG.baseUrl;
                const ids = {
                    amount: cfg.amount || CONFIG.ids.amount,
                    category: cfg.category || CONFIG.ids.category,
                    payment: cfg.payment || CONFIG.ids.payment,
                    date: cfg.date || CONFIG.ids.date,
                    memo: cfg.memo || CONFIG.ids.memo
                };

                // 値を取得
                const catVal = document.querySelector('input[name="category"]:checked')?.value || '';
                const payVal = document.querySelector('input[name="payment"]:checked')?.value || '';

                // URL生成
                const p = new URLSearchParams();
                p.append(ids.amount, els.amount.value);
                p.append(ids.category, catVal);
                p.append(ids.payment, payVal);
                p.append(ids.date, els.date.value);
                if(els.memo.value) p.append(ids.memo, els.memo.value);

                const finalUrl = `${baseUrl}${baseUrl.includes('?')?'&':'?'}${p.toString()}`;

                // 強制遷移 (隠しリンククリック)
                els.hiddenLink.href = finalUrl;
                els.hiddenLink.click();
                
                showToast('送信画面へ移動します...');
            };

            // AI機能
            const callGemini = async (text, imageBase64, mimeType, autoSend) => {
                const apiKey = els.sApiKey.value;
                if(!apiKey) { alert('設定からGemini APIキーを入力してください'); return; }

                const btn = autoSend ? els.analyzeSendBtn : els.analyzeBtn;
                const originalText = btn.innerText;
                btn.innerText = '解析中...';
                btn.classList.add('ai-thinking');

                const prompt = `
                    You are a budget assistant. Today is ${els.date.value}.
                    Extract: amount(int), category(string), payment(string), date(YYYY-MM-DD), memo(string).
                    Categories: ${CATEGORIES.map(c=>c.val).join(',')}.
                    Payments: ${PAYMENTS.map(p=>p.val).join(',')}.
