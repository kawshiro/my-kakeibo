<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI家計簿入力 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
        // エラー監視
        window.onerror = function(msg, url, line) {
            console.error('Global Error:', msg, line);
        };
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* ラジオボタンの見た目 */
        .category-radio:checked + div {
            background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8;
            box-shadow: inset 0 0 0 2px #3b82f6; font-weight: bold;
        }
        .payment-radio:checked + div {
            background-color: #f0fdf4; border-color: #22c55e; color: #15803d;
            box-shadow: inset 0 0 0 2px #22c55e; font-weight: bold;
        }

        /* グリッド */
        .compact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .compact-item {
            height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid #e5e7eb; font-size: 10px; background: white;
        }
        .compact-item i { font-size: 18px; margin-bottom: 4px; }

        /* Geminiボタン */
        .gemini-btn {
            background: linear-gradient(135deg, #4b90ff 0%, #ff5546 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: fixed; bottom: 20px; right: 20px;
            width: 64px; height: 64px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; z-index: 50; cursor: pointer; border: none;
        }
        .gemini-btn:active { transform: scale(0.95); }
        
        /* 解析中ローダー */
        .spinner {
            width: 20px; height: 20px; border: 3px solid #e5e7eb;
            border-top: 3px solid #4f46e5; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 録音中のアニメーション */
        .mic-active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 設定モーダル -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-sm max-h-[90vh] overflow-y-auto flex flex-col shadow-2xl">
            <div class="p-4 border-b font-bold flex justify-between">
                <span>設定</span>
                <button id="close-settings" class="text-gray-500 px-2">✕</button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-indigo-700 mb-1">Gemini APIキー (必須)</label>
                    <input type="password" id="s-api-key" class="w-full p-2 border rounded bg-indigo-50 font-mono text-sm" placeholder="AIキーを入力">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">フォームURL</label>
                    <input type="text" id="s-url" class="w-full p-2 border rounded text-xs font-mono">
                </div>
                <div class="border-t pt-2 space-y-2">
                    <p class="text-xs font-bold">エントリーID</p>
                    <input type="text" id="s-amt" placeholder="金額ID" class="w-full p-1 border rounded text-xs font-mono">
                    <input type="text" id="s-cat" placeholder="費目ID" class="w-full p-1 border rounded text-xs font-mono">
                    <input type="text" id="s-pay" placeholder="支払ID" class="w-full p-1 border rounded text-xs font-mono">
                    <input type="text" id="s-date" placeholder="日付ID" class="w-full p-1 border rounded text-xs font-mono">
                    <input type="text" id="s-memo" placeholder="備考ID" class="w-full p-1 border rounded text-xs font-mono">
                </div>
            </div>
        </div>
    </div>

    <!-- カメラモーダル -->
    <div id="camera-modal" class="hidden fixed inset-0 bg-black z-[60] flex flex-col">
        <div class="absolute top-4 right-4 z-10">
            <button id="close-camera" class="w-10 h-10 bg-white/20 text-white rounded-full flex items-center justify-center">✕</button>
        </div>
        <div class="flex-1 bg-black flex items-center justify-center overflow-hidden">
            <video id="camera-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <div class="h-32 bg-black/80 flex items-center justify-center shrink-0">
            <button id="shutter-btn" class="w-16 h-16 rounded-full bg-white border-4 border-gray-400"></button>
        </div>
    </div>

    <!-- AI入力モーダル -->
    <div id="ai-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl w-full max-w-md flex flex-col shadow-2xl h-[600px] max-h-[90vh]">
            <div class="p-3 bg-indigo-600 text-white rounded-t-xl flex justify-between items-center shrink-0">
                <span class="font-bold"><i class="fas fa-sparkles text-yellow-300"></i> AI自動入力</span>
                <button id="close-ai" class="w-8 h-8 hover:bg-white/20 rounded-full">✕</button>
            </div>
            
            <div class="p-4 flex-1 flex flex-col gap-3 overflow-y-auto">
                <div class="text-xs text-gray-500 text-center shrink-0">
                    内容を入力、または下のボタンで音声・画像を追加
                </div>
                
                <!-- 1. 入力窓 (上に配置) -->
                <textarea id="ai-text" class="w-full p-3 border-2 border-indigo-100 rounded-lg h-32 focus:border-indigo-500 outline-none resize-none bg-gray-50 text-lg" placeholder="例: 昨日コンビニで弁当500円"></textarea>
                
                <!-- 写真プレビュー -->
                <div id="preview-area" class="hidden relative h-32 bg-gray-100 rounded-lg overflow-hidden border shrink-0">
                    <img id="img-preview" class="w-full h-full object-contain">
                    <button id="clear-img" class="absolute top-1 right-1 bg-black/50 text-white w-6 h-6 rounded-full text-xs">✕</button>
                </div>

                <!-- スペーサー -->
                <div class="flex-1"></div>

                <div id="ai-msg" class="text-center text-xs text-indigo-600 h-5 font-bold shrink-0"></div>

                <!-- 2. ボタンエリア (下に配置) -->
                <div class="flex items-end justify-center gap-6 my-2 h-24 shrink-0">
                    <!-- アルバム (優先度3) -->
                    <label class="flex flex-col items-center justify-center gap-1 w-14 h-14 rounded-full bg-green-50 text-green-600 border border-green-200 shadow-sm active:scale-95 transition-all cursor-pointer">
                        <i class="fas fa-image text-lg"></i>
                        <span class="text-[9px] font-bold">アルバム</span>
                        <input type="file" id="file-input" accept="image/*" class="hidden">
                    </label>

                    <!-- マイク (優先度1: 中央・特大) -->
                    <button id="btn-mic" class="flex flex-col items-center justify-center w-20 h-20 -mb-2 rounded-full bg-gradient-to-br from-red-500 to-rose-600 text-white shadow-xl active:scale-95 transition-all z-10 border-4 border-white">
                        <i class="fas fa-microphone text-3xl mb-1"></i>
                        <span class="text-[10px] font-bold">音声入力</span>
                    </button>

                    <!-- カメラ (優先度2) -->
                    <button id="btn-camera" class="flex flex-col items-center justify-center gap-1 w-16 h-16 rounded-full bg-blue-50 text-blue-600 border border-blue-200 shadow-sm active:scale-95 transition-all">
                        <i class="fas fa-camera text-xl"></i>
                        <span class="text-[9px] font-bold">カメラ</span>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3 pb-2 shrink-0">
                    <button id="btn-analyze" class="border-2 border-indigo-600 text-indigo-600 py-3 rounded-lg font-bold hover:bg-indigo-50 transition-colors">入力反映</button>
                    <button id="btn-analyze-send" class="bg-indigo-600 text-white py-3 rounded-lg font-bold shadow-md hover:bg-indigo-700 transition-colors">解析＆送信</button>
                </div>
            </div>
        </div>
    </div>

    <!-- メイン画面 -->
    <div class="bg-indigo-600 p-4 text-white shrink-0 shadow-md z-10">
        <div class="flex justify-between items-center mb-2">
            <input type="date" id="inp-date" class="bg-white/20 border-none rounded px-2 py-1 text-sm font-bold text-white outline-none">
            <button id="btn-settings" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition"><i class="fas fa-cog"></i></button>
        </div>
        <div class="flex items-end border-b border-indigo-400 pb-1">
            <span class="text-2xl mr-2 opacity-70">¥</span>
            <input type="number" id="inp-amount" class="bg-transparent text-5xl font-bold w-full outline-none placeholder-indigo-300" placeholder="0">
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-2 bg-gray-50 pb-24">
        <!-- カテゴリー -->
        <div class="bg-white p-3 rounded-xl mb-3 shadow-sm border border-gray-100">
            <div class="text-xs text-gray-500 font-bold mb-2">カテゴリー</div>
            <div class="compact-grid">
                <label class="cursor-pointer"><input type="radio" name="cat" value="食費" class="category-radio sr-only" checked><div class="compact-item"><i class="fas fa-utensils text-orange-500"></i>食費</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="日用品" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-shopping-basket text-green-500"></i>日用品</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="衣服・美容費" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-tshirt text-pink-500"></i>衣服</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="娯楽・交際費" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-glass-cheers text-purple-500"></i>交際</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="交通費" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-train text-blue-500"></i>交通</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="通信費" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-wifi text-cyan-500"></i>通信</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="医療費" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-clinic-medical text-red-500"></i>医療</div></label>
                <label class="cursor-pointer"><input type="radio" name="cat" value="その他" class="category-radio sr-only"><div class="compact-item"><i class="fas fa-ellipsis-h text-gray-400"></i>他</div></label>
            </div>
        </div>

        <!-- 支払い方法 -->
        <div class="bg-white p-3 rounded-xl mb-3 shadow-sm border border-gray-100">
            <div class="text-xs text-gray-500 font-bold mb-2">支払い方法</div>
            <div class="compact-grid">
                <label class="cursor-pointer"><input type="radio" name="pay" value="現金" class="payment-radio sr-only" checked><div class="compact-item"><i class="fas fa-coins text-gray-600"></i>現金</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="paypay" class="payment-radio sr-only"><div class="compact-item"><span class="font-bold text-red-500">P</span>PayPay</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="モバイルSuica" class="payment-radio sr-only"><div class="compact-item"><i class="fas fa-mobile-alt text-green-600"></i>Suica</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="olive" class="payment-radio sr-only"><div class="compact-item"><i class="fas fa-leaf text-lime-600"></i>Olive</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="三井住友ゴールドカード" class="payment-radio sr-only"><div class="compact-item"><i class="fas fa-credit-card text-yellow-600"></i>住友G</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="楽天カード" class="payment-radio sr-only"><div class="compact-item"><i class="fas fa-credit-card text-pink-600"></i>楽天</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="viewカード" class="payment-radio sr-only"><div class="compact-item"><i class="fas fa-subway text-blue-600"></i>View</div></label>
                <label class="cursor-pointer"><input type="radio" name="pay" value="その他" class="payment-radio sr-only"><div class="compact-item"><i class="fas fa-ellipsis-h text-gray-400"></i>他</div></label>
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <input type="text" id="inp-memo" class="w-full p-3 border rounded-lg" placeholder="メモ">
            <button id="btn-send" class="bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">
                記録する <i class="fas fa-chevron-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- 右下AIボタン -->
    <button id="btn-open-ai" class="gemini-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L9.17 8.17 3 11l6.17 2.83L12 20l2.83-6.17L21 11l-6.17-2.83z"/>
        </svg>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const CONFIG_KEY = 'budget_app_2026';
            const DEFAULTS = {
                url: 'https://docs.google.com/forms/d/e/1FAIpQLSdyfO5WEIVhLXzE9o7R29heMt6w5Pvf-iEgfZFPztJChzzO_Q/viewform',
                ids: { amt: 'entry.319120210', cat: 'entry.1341647002', pay: 'entry.594957767', date: 'entry.217676147', memo: 'entry.1139655263' }
            };

            const get = (id) => document.getElementById(id);
            let imgBase64 = null;
            let stream = null;
            let recognition = null;

            try {
                loadSettings();
                get('inp-date').value = new Date().toISOString().split('T')[0];
                
                get('btn-settings').onclick = () => get('settings-modal').classList.remove('hidden');
                get('close-settings').onclick = () => { saveSettings(); get('settings-modal').classList.add('hidden'); };
                get('btn-open-ai').onclick = () => get('ai-modal').classList.remove('hidden');
                get('close-ai').onclick = () => get('ai-modal').classList.add('hidden');
                get('btn-camera').onclick = startCamera;
                get('close-camera').onclick = stopCamera;
                get('shutter-btn').onclick = takePhoto;
                get('file-input').onchange = (e) => processFile(e.target.files[0]);
                get('clear-img').onclick = clearImage;
                get('btn-analyze').onclick = () => runAI(false);
                get('btn-analyze-send').onclick = () => runAI(true);
                get('btn-send').onclick = sendForm;
                
                // メモ欄でEnterキー送信
                get('inp-memo').onkeydown = (e) => {
                    if (e.key === 'Enter' && !e.isComposing) {
                        e.preventDefault();
                        sendForm();
                        get('inp-memo').blur();
                    }
                };
                
                initSpeechRecognition();
                get('btn-mic').onclick = toggleSpeech;

            } catch(e) {
                alert('初期化エラー: ' + e.message);
            }

            function loadSettings() {
                const data = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
                get('s-api-key').value = data.key || '';
                get('s-url').value = data.url || DEFAULTS.url;
                get('s-amt').value = data.amt || DEFAULTS.ids.amt;
                get('s-cat').value = data.cat || DEFAULTS.ids.cat;
                get('s-pay').value = data.pay || DEFAULTS.ids.pay;
                get('s-date').value = data.date || DEFAULTS.ids.date;
                get('s-memo').value = data.memo || DEFAULTS.ids.memo;
            }

            function saveSettings() {
                const data = {
                    key: get('s-api-key').value, url: get('s-url').value,
                    amt: get('s-amt').value, cat: get('s-cat').value, pay: get('s-pay').value,
                    date: get('s-date').value, memo: get('s-memo').value
                };
                localStorage.setItem(CONFIG_KEY, JSON.stringify(data));
            }

            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    get('btn-mic').style.display = 'none'; 
                    return;
                }
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.onstart = () => {
                    get('btn-mic').classList.add('mic-active');
                    get('ai-msg').textContent = '聞いています...';
                };
                recognition.onend = () => {
                    get('btn-mic').classList.remove('mic-active');
                    get('ai-msg').textContent = '';
                };
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    const textEl = get('ai-text');
                    textEl.value += (textEl.value ? ' ' : '') + transcript;
                };
                recognition.onerror = (event) => {
                    get('btn-mic').classList.remove('mic-active');
                    get('ai-msg').textContent = '認識エラー';
                };
            }

            function toggleSpeech() {
                if (!recognition) return;
                if (get('btn-mic').classList.contains('mic-active')) recognition.stop();
                else recognition.start();
            }

            async function startCamera() {
                try {
                    const constraints = { video: { facingMode: 'environment' } };
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    get('camera-video').srcObject = stream;
                    get('camera-modal').classList.remove('hidden');
                } catch (err) {
                    alert('カメラエラー: ' + err.message);
                }
            }

            function stopCamera() {
                if(stream) stream.getTracks().forEach(t => t.stop());
                get('camera-modal').classList.add('hidden');
            }

            function takePhoto() {
                const video = get('camera-video');
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const data = canvas.toDataURL('image/jpeg', 0.8);
                const img = new Image();
                img.src = data;
                img.onload = () => {
                    const c2 = document.createElement('canvas');
                    const max = 800;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > max) { h *= max/w; w = max; } }
                    else { if (h > max) { w *= max/h; h = max; } }
                    c2.width = w; c2.height = h;
                    c2.getContext('2d').drawImage(img, 0, 0, w, h);
                    setImage(c2.toDataURL('image/jpeg', 0.8));
                    stopCamera();
                };
            }

            function processFile(file) {
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        const max = 800;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > max) { h *= max/w; w = max; } }
                        else { if (h > max) { w *= max/h; h = max; } }
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        setImage(c.toDataURL('image/jpeg', 0.8));
                    }
                };
                reader.readAsDataURL(file);
                get('file-input').value = '';
            }

            function setImage(data) {
                imgBase64 = data;
                get('img-preview').src = data;
                get('preview-area').classList.remove('hidden');
            }

            function clearImage() {
                imgBase64 = null;
                get('preview-area').classList.add('hidden');
            }

            async function runAI(autoSend) {
                const key = get('s-api-key').value;
                if(!key) return alert('APIキーを設定してください');
                
                const text = get('ai-text').value;
                if(!text && !imgBase64) return alert('入力が必要です');

                get('ai-msg').innerHTML = '<div class="spinner inline-block align-middle mr-2"></div>解析中...';
                get('btn-analyze').disabled = true;

                try {
                    const payload = {
                        contents: [{ parts: [] }],
                        generationConfig: { responseMimeType: "application/json" }
                    };
                    
                    const today = new Date().toISOString().split('T')[0];
                    const prompt = `あなたは家計簿入力アシスタントです。今日は${today}です。入力データから以下のJSONを抽出してください: {"amount":数値, "category":"食費/日用品/衣服・美容費/娯楽・交際費/交通費/通信費/医療費/その他", "payment":"現金/paypay/モバイルSuica/olive/三井住友ゴールドカード/楽天カード/viewカード/その他", "date":"YYYY-MM-DD", "memo":文字列}`;
                    
                    payload.contents[0].parts.push({ text: prompt });
                    if(text) payload.contents[0].parts.push({ text: "Input: " + text });
                    if(imgBase64) payload.contents[0].parts.push({ inlineData: { mimeType: "image/jpeg", data: imgBase64.split(',')[1] } });

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const json = await res.json();
                    if(json.error) throw new Error(json.error.message);
                    const result = JSON.parse(json.candidates[0].content.parts[0].text);
                    
                    if(result.amount) get('inp-amount').value = result.amount;
                    if(result.date) get('inp-date').value = result.date;
                    if(result.memo) get('inp-memo').value = result.memo;
                    if(result.category) {
                        const el = document.querySelector(`input[name="cat"][value="${result.category}"]`);
                        if(el) el.checked = true;
                    }
                    if(result.payment) {
                        const el = document.querySelector(`input[name="pay"][value="${result.payment}"]`);
                        if(el) el.checked = true;
                    }

                    get('ai-modal').classList.add('hidden');
                    get('ai-text').value = '';
                    clearImage();

                    if(autoSend) sendForm();
                    else alert('完了しました');

                } catch(e) {
                    alert('AIエラー: ' + e.message);
                } finally {
                    get('ai-msg').textContent = '';
                    get('btn-analyze').disabled = false;
                }
            }

            function sendForm() {
                const amt = get('inp-amount').value;
                if(!amt) return alert('金額を入力してください');
                
                const cat = document.querySelector('input[name="cat"]:checked')?.value || 'その他';
                const pay = document.querySelector('input[name="pay"]:checked')?.value || '現金';
                const date = get('inp-date').value;
                const memo = get('inp-memo').value;

                const url = get('s-url').value;
                const params = new URLSearchParams();
                params.append(get('s-amt').value, amt);
                params.append(get('s-cat').value, cat);
                params.append(get('s-pay').value, pay);
                params.append(get('s-date').value, date);
                if(memo) params.append(get('s-memo').value, memo);

                let finalUrl = url;
                if(!finalUrl.includes('?')) finalUrl += '?';
                else finalUrl += '&';
                
                window.open(`${finalUrl}usp=pp_url&${params.toString()}`, '_blank');
                get('inp-amount').value = '';
                get('inp-memo').value = '';
            }
        });
    </script>
</body>
</html>
